<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard de Gestão de KPI - Zero Erros</title>
    <!-- Tailwind CSS para estilização -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Chart.js para gráficos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <!-- SheetJS (xlsx) para leitura da planilha -->
    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-6">

    <!-- Cabeçalho -->
    <div class="flex justify-between items-center mb-8 border-b border-gray-700 pb-4">
        <div>
            <h1 class="text-3xl font-bold text-blue-400">Dashboard de Qualidade - API Endpoints</h1>
            <p class="text-gray-400 text-sm">Meta: 0 Erros por Endpoint</p>
        </div>
        <div class="text-right">
            <span id="status-badge" class="px-3 py-1 rounded-full text-xs font-semibold bg-gray-700 text-gray-300">Carregando...</span>
            <p class="text-xs text-gray-500 mt-2">Última atualização: <span id="last-updated">-</span></p>
        </div>
    </div>

    <!-- Cards de KPIs -->
    <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h3 class="text-gray-400 text-sm">Total de Endpoints</h3>
            <p id="kpi-total-endpoints" class="text-3xl font-bold mt-2">0</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h3 class="text-gray-400 text-sm">Total de Erros acumulados</h3>
            <p id="kpi-total-erros" class="text-3xl font-bold text-red-500 mt-2">0</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h3 class="text-gray-400 text-sm">Endpoints com Zero Erros (Meta)</h3>
            <p id="kpi-zero-erros" class="text-3xl font-bold text-green-500 mt-2">0</p>
        </div>
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h3 class="text-gray-400 text-sm">Taxa de Conformidade</h3>
            <p id="kpi-conformidade" class="text-3xl font-bold text-blue-500 mt-2">0%</p>
        </div>
    </div>

    <!-- Seção Principal: Gráfico e Tabela -->
    <div class="grid grid-cols-1 lg:grid-cols-2 gap-8">
        <!-- Gráfico de Erros por Endpoint -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg">
            <h2 class="text-xl font-bold mb-4 text-gray-200">Erros por Endpoint</h2>
            <div class="relative h-72">
                <canvas id="chartErros"></canvas>
            </div>
        </div>

        <!-- Tabela Detalhada por Endpoint -->
        <div class="bg-gray-800 p-6 rounded-xl border border-gray-700 shadow-lg overflow-x-auto">
            <h2 class="text-xl font-bold mb-4 text-gray-200">Status dos Endpoints</h2>
            <table class="w-full text-left text-sm text-gray-300">
                <thead class="bg-gray-700 text-gray-100 uppercase text-xs">
                    <tr>
                        <th class="p-3">Endpoint</th>
                        <th class="p-3 text-center">Erros</th>
                        <th class="p-3 text-center">Status (Meta: 0)</th>
                    </tr>
                </thead>
                <tbody id="table-body">
                    <!-- Linhas geradas via JavaScript -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Script de Lógica -->
    <script>
        let chartInstance = null;

        // Estrutura esperada do Excel dados.xlsx (Exemplo):
        // Coluna A: Endpoint | Coluna B: Erros
        async function carregarDadosExcel() {
            const statusBadge = document.getElementById('status-badge');
            try {
                // Adiciona timestamp para evitar cache do navegador na leitura do arquivo
                const response = await fetch(`dados.xlsx?t=${new Date().getTime()}`);
                if (!response.ok) throw new Error("Arquivo dados.xlsx não encontrado.");

                const data = await response.arrayBuffer();
                const workbook = XLSX.read(data, { type: 'array' });

                // Lê a primeira aba da planilha
                const sheetName = workbook.SheetNames[0];
                const worksheet = workbook.Sheets[sheetName];
                
                // Converte para JSON
                const json = XLSX.utils.sheet_to_json(worksheet);

                processarKPIs(json);

                statusBadge.textContent = "Sincronizado";
                statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-green-900 text-green-300";
                document.getElementById('last-updated').textContent = new Date().toLocaleTimeString('pt-BR');

            } catch (error) {
                console.error("Erro ao carregar o Excel:", error);
                statusBadge.textContent = "Erro na Leitura";
                statusBadge.className = "px-3 py-1 rounded-full text-xs font-semibold bg-red-900 text-red-300";
            }
        }

        function processarKPIs(dados) {
            // Mapeamento dinâmico: tenta buscar colunas 'Endpoint' e 'Erros' (independente de maiúsculas/minúsculas)
            const listaEndpoints = dados.map(row => {
                const keyEndpoint = Object.keys(row).find(k => k.toLowerCase().includes('endpoint')) || Object.keys(row)[0];
                const keyErros = Object.keys(row).find(k => k.toLowerCase().includes('erro')) || Object.keys(row)[1];
                
                return {
                    nome: row[keyEndpoint] || 'Desconhecido',
                    erros: parseInt(row[keyErros]) || 0
                };
            });

            // Métricas de KPI
            const totalEndpoints = listaEndpoints.length;
            const totalErros = listaEndpoints.reduce((acc, curr) => acc + curr.erros, 0);
            const endpointsZeroErros = listaEndpoints.filter(e => e.erros === 0).length;
            const taxaConformidade = totalEndpoints > 0 ? ((endpointsZeroErros / totalEndpoints) * 100).toFixed(1) : 0;

            // Atualização dos Cards
            document.getElementById('kpi-total-endpoints').textContent = totalEndpoints;
            document.getElementById('kpi-total-erros').textContent = totalErros;
            document.getElementById('kpi-zero-erros').textContent = endpointsZeroErros;
            document.getElementById('kpi-conformidade').textContent = `${taxaConformidade}%`;

            // Atualização da Tabela
            const tbody = document.getElementById('table-body');
            tbody.innerHTML = '';

            listaEndpoints.forEach(item => {
                const tr = document.createElement('tr');
                tr.className = "border-b border-gray-700 hover:bg-gray-750";
                
                const atingiuMeta = item.erros === 0;
                const statusTag = atingiuMeta 
                    ? '<span class="bg-green-900 text-green-300 px-2 py-1 rounded text-xs font-semibold">Meta Atingida</span>'
                    : '<span class="bg-red-900 text-red-300 px-2 py-1 rounded text-xs font-semibold">Fora da Meta</span>';

                tr.innerHTML = `
                    <td class="p-3 font-mono text-gray-200">${item.nome}</td>
                    <td class="p-3 text-center font-bold ${item.erros > 0 ? 'text-red-400' : 'text-green-400'}">${item.erros}</td>
                    <td class="p-3 text-center">${statusTag}</td>
                `;
                tbody.appendChild(tr);
            });

            // Atualização do Gráfico
            renderizarGrafico(listaEndpoints);
        }

        function renderizarGrafico(dados) {
            const ctx = document.getElementById('chartErros').getContext('2d');
            
            const labels = dados.map(d => d.nome);
            const valores = dados.map(d => d.erros);
            const cores = dados.map(d => d.erros === 0 ? '#10B981' : '#EF4444');

            if (chartInstance) {
                chartInstance.destroy();
            }

            chartInstance = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Quantidade de Erros',
                        data: valores,
                        backgroundColor: cores,
                        borderRadius: 6
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    plugins: {
                        legend: { display: false }
                    },
                    scales: {
                        x: { ticks: { color: '#9CA3AF' }, grid: { display: false } },
                        y: { ticks: { color: '#9CA3AF' }, grid: { color: '#374151' }, beginAtZero: true }
                    }
                }
            });
        }

        // Leitura Inicial ao carregar a página
        carregarDadosExcel();

        // Configuração de leitura automática a cada 30 minutos (1.800.000 ms)
        const trintaMinutosEmMs = 30 * 60 * 1000;
        setInterval(carregarDadosExcel, trintaMinutosEmMs);
    </script>
</body>
</html>
